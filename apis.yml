name: Scoutzie
description: >-
  Scoutzie is a Y Combinator-founded company (2012) led by Kirill Zubovsky. It
  launched as a curated marketplace connecting startups with top mobile designers
  and developers, operating from 2012 to 2020, and has since transformed into an
  AI-powered MVP (minimum viable product) development agency that builds and ships
  startup products in roughly two weeks. Today Scoutzie sells product-development
  services, an MVP Agent, founder training, and SEO consulting rather than a public
  developer API. It was surfaced through the a16z portfolio graph and enriched here
  as an API Evangelist network company profile.
